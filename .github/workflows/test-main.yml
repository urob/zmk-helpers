name: Run tests (main)

on:
  workflow_dispatch:
  push:
    paths:
      - "dts/**"
      - "include/**"
      - "src/**"
      - "tests/**"
  pull_request:
    paths:
      - "dts/**"
      - "include/**"
      - "src/**"
      - "tests/**"
  schedule:
    - cron: "0 21 * * 0,3" # Run every Sunday and Wednesday at 21:00 UTC

jobs:
  test:
    uses: urob/zmk-actions/.github/workflows/run-tests.yml@e89b7f5bd1226bc6cf9d20c12e649dc44b0a24a2 # v12.2.0
    with:
      toolchain: gnuarmemb
      zmk-version: main
